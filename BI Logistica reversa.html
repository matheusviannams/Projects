<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Gerencial - Logística Reversa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-gray-800">🔄 Cockpit de Logística Reversa</h1>
            <p class="text-gray-600">Insira os dados das 10 POs para gerar os insights gerenciais</p>
        </header>

        <!-- Área de Entrada de Dados (Limpa e Organizada) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">📋 Inserir Dados das Ordens (POs)</h2>
            
            <div id="containerDados" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Gerado via JavaScript para manter o código limpo -->
            </div>

            <button onclick="processarDashboard()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md">
                Gerar Dashboard e 10 Insights Estratégicos
            </button>
        </section>

        <!-- Dashboard Gerencial (Oculto inicialmente) -->
        <div id="dashboard" class="hidden space-y-6">
            <!-- KPIs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-indigo-600">
                    <p class="text-xs text-gray-500 font-bold uppercase">Total de POs</p>
                    <span id="kpiPOs" class="text-2xl font-bold text-gray-800">0</span>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500">
                    <p class="text-xs text-gray-500 font-bold uppercase">Valor Recuperado</p>
                    <span id="kpiValor" class="text-2xl font-bold text-gray-800">R$ 0</span>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-amber-500">
                    <p class="text-xs text-gray-500 font-bold uppercase">Custo Logístico</p>
                    <span id="kpiCusto" class="text-2xl font-bold text-gray-800">R$ 0</span>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-500">
                    <p class="text-xs text-gray-500 font-bold uppercase">Ciclo Médio</p>
                    <span id="kpiCiclo" class="text-2xl font-bold text-gray-800">0 dias</span>
                </div>
            </div>

            <!-- Insights -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <h3 class="text-lg font-bold text-gray-800 mb-4">📊 10 Insights para o Gerente de Logística</h3>
                <ul id="listaInsights" class="space-y-3 text-sm text-gray-700"></ul>
            </div>
        </div>
    </div>

    <script>
        // Criar 10 cards de entrada simplificados
        const container = document.getElementById('containerDados');
        for(let i = 1; i <= 10; i++) {
            container.innerHTML += `
            <div class="bg-gray-50 p-4 rounded-xl border flex flex-col gap-3 card-po">
                <div class="flex justify-between items-center font-bold text-xs text-indigo-600">
                    <span>ORDEM DE COMPRA #${i}</span>
                    <select class="input-tipo border rounded px-2 py-1 text-xs bg-white text-gray-700 font-normal">
                        <option>Devolução</option>
                        <option>Troca</option>
                    </select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-500 uppercase font-semibold">ID PO</label>
                        <input type="text" value="PO-2026-${10+i}" class="input-id w-full border rounded p-1.5 text-xs bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 uppercase font-semibold">Valor (R$)</label>
                        <input type="number" value="${(Math.random()*400 + 150).toFixed(0)}" class="input-valor w-full border rounded p-1.5 text-xs bg-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500 uppercase font-semibold">Frete (R$)</label>
                        <input type="number" value="${(Math.random()*60 + 15).toFixed(0)}" class="input-custo w-full border rounded p-1.5 text-xs bg-white">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 uppercase font-semibold">Tempo de Ciclo (Dias)</label>
                    <input type="number" value="${(Math.random()*12 + 3).toFixed(0)}" class="input-dias w-full border rounded p-1.5 text-xs bg-white">
                </div>
            </div>`;
        }

        function processarDashboard() {
            const cards = document.querySelectorAll('.card-po');
            let totalValor = 0, totalCusto = 0, totalDias = 0;
            
            cards.forEach(card => {
                totalValor += parseFloat(card.querySelector('.input-valor').value) || 0;
                totalCusto += parseFloat(card.querySelector('.input-custo').value) || 0;
                totalDias += parseFloat(card.querySelector('.input-dias').value) || 0;
            });

            const cicloMedio = (totalDias / cards.length).toFixed(1);
            const razaoFrete = ((totalCusto / totalValor) * 100).toFixed(1);

            document.getElementById('kpiPOs').innerText = cards.length;
            document.getElementById('kpiValor').innerText = `R$ ${totalValor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('kpiCusto').innerText = `R$ ${totalCusto.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('kpiCiclo').innerText = `${cicloMedio} dias`;
            
            const insights = [
                `<strong>1. Impacto do Frete Reverso:</strong> O custo logístico representa <strong>${razaoFrete}%</strong> do valor total recuperado nas POs analisadas.`,
                `<strong>2. Lead Time Operacional:</strong> O ciclo médio de devolução está em <strong>${cicloMedio} dias</strong>, métrica fundamental para evitar a obsolescência do estoque.`,
                `<strong>3. Indicador de Ruptura:</strong> A proporção entre 'Devoluções' e 'Trocas' sugere um mapeamento urgente dos motivos geradores junto aos canais de venda.`,
                `<strong>4. Saúde Financeira:</strong> O fluxo de caixa está recuperando um montante expressivo, embora os custos de transporte precisem de auditoria por rota.`,
                `<strong>5. Eficiência de Triagem:</strong> POs com ciclos acima da média apontam possíveis gargalos operacionais no centro de distribuição de recebimento.`,
                `<strong>6. Sazonalidade de Retorno:</strong> O volume concentrado de itens exige reavaliação da capacidade de armazenamento temporário (área de quarentena).`,
                `<strong>7. Qualidade de Fornecedores:</strong> O rastreio individual destas POs permite aplicar penalidades contratuais em caso de reincidência de defeitos.`,
                `<strong>8. Otimização de Processos:</strong> Automatizar a emissão de etiquetas de postagem pode encurtar a primeira etapa do ciclo reverso.`,
                `<strong>9. Custos Ocultos:</strong> O frete reverso desproporcional em itens de baixo valor (baixo ticket) corrói a margem líquida da operação.`,
                `<strong>10. Recomendação Executiva:</strong> Priorizar parcerias com operadores logísticos especializados em consolidação de carga reversa regional.`
            ];
            
            document.getElementById('listaInsights').innerHTML = insights.map(i => `<li class="bg-gray-50 p-3 rounded-lg border-l-2 border-indigo-400">${i}</li>`).join('');
            document.getElementById('dashboard').classList.remove('hidden');
        }
    </script>
</body>
</html>
