<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precificação Farmacêutica</title>
    <style>
        :root { 
            --primary-color: #0f766e; 
            --primary-hover: #115e59;
            --bg-color: #f0fdfa; 
            --text-color: #1f2937; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: var(--primary-color); 
            margin-top: 0;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 5px; 
            font-size: 14px;
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }
        button { 
            width: 100%; 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 12px; 
            font-weight: bold; 
            font-size: 16px;
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: var(--primary-hover); 
        }
        .result { 
            margin-top: 25px; 
            padding: 20px; 
            background-color: #f9fafb; 
            border-radius: 8px; 
            border-left: 5px solid var(--primary-color); 
        }
        .result h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 15px;
        }
        .res-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            font-size: 15px;
        }
        .res-item.highlight {
            font-weight: bold;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Precificação Farmacêutica</h2>
    
    <div class="form-group">
        <label>Custo de Aquisição do Produto (R$):</label>
        <input type="number" id="custo" step="0.01" placeholder="0,00">
    </div>
    
    <div class="form-group">
        <label>PF - Preço de Fábrica (R$):</label>
        <input type="number" id="pf" step="0.01" placeholder="0,00">
    </div>
    
    <div class="form-group">
        <label>PMC - Preço Máximo ao Consumidor (R$):</label>
        <input type="number" id="pmc" step="0.01" placeholder="0,00">
    </div>
    
    <div class="form-group">
        <label>Margem de Lucro Desejada (%):</label>
        <input type="number" id="margemDesejada" step="0.1" value="30">
    </div>
    
    <button onclick="calcular()">Calcular Preço</button>

    <div id="res" class="result" style="display:none;">
        <h3>Resultado da Precificação</h3>
        <div class="res-item"><span>Preço de Venda Exato:</span><span id="pVenda"></span></div>
        <div class="res-item highlight"><span>Preço Psicológico (.99):</span><span id="pPsic"></span></div>
        <div class="res-item"><span>Margem Real da Venda:</span><span id="mReal"></span></div>
        <div class="res-item"><span>Markup (Fator sobre o Custo):</span><span id="markup"></span></div>
        <div class="res-item"><span>Percentual em relação ao Custo:</span><span id="percCusto"></span></div>
    </div>
</div>

<script>
function calcular() {
    const custo = parseFloat(document.getElementById('custo').value) || 0;
    const pmc = parseFloat(document.getElementById('pmc').value) || 0;
    const margemDesejada = parseFloat(document.getElementById('margemDesejada').value) / 100;

    if (custo <= 0) {
        alert("Por favor, informe um custo válido.");
        return;
    }

    // Cálculo base do preço de venda com base na margem desejada
    let pVenda = custo / (1 - margemDesejada);
    
    // Trava de segurança: Preço de venda não pode ultrapassar o PMC (se preenchido)
    if (pmc > 0 && pVenda > pmc) {
        pVenda = pmc;
    }

    // Preço psicológico (arredondado para terminar em .99)
    let pPsic = Math.floor(pVenda) + 0.99;
    if (pPsic < pVenda) {
        pPsic += 1;
    }

    // Cálculos de margens e percentuais
    const mReal = ((pVenda - custo) / pVenda) * 100;
    const markup = pVenda / custo;
    const percCusto = ((pVenda - custo) / custo) * 100;

    // Exibição na tela
    document.getElementById('pVenda').innerText = pVenda.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    document.getElementById('pPsic').innerText = pPsic.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    document.getElementById('mReal').innerText = mReal.toFixed(2) + "%";
    document.getElementById('markup').innerText = markup.toFixed(2) + "x";
    document.getElementById('percCusto').innerText = "+" + percCusto.toFixed(2) + "%";
    
    document.getElementById('res').style.display = 'block';
}
</script>

</body>
</html>
